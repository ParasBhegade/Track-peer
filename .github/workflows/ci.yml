name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habittracker
          POSTGRES_PASSWORD: habittracker_dev
          POSTGRES_DB: habittracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habittracker"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://habittracker:habittracker_dev@localhost:5432/habittracker_test
      JWT_SECRET: ci-test-secret-not-for-production
      APP_ENV: testing
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy .

      - name: Run migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: python -m pytest -v

      - name: Verify OpenAPI contract drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code ../docs/openapi.json || (echo "OpenAPI schema drifted. Run scripts/export_openapi.py and commit the changes." && exit 1)
